# SQLAlchemy's dialect compliance suite, run against a chosen seerdb: the
# release a user installs (`latest`), a pinned release (`2.5.0`), or the
# driver's current `master`. Reusable: the push/PR workflow calls it for
# `latest` and `master`, the on-demand one for whatever it is asked.
name: Compliance

on:
  workflow_call:
    inputs:
      seerdb:
        description: "latest (PyPI) | tag (seerdb's newest git tag) | master | a released version such as 2.5.0"
        required: true
        type: string
      dialect:
        description: "checkout (the code being tested) | tag (this repository's newest git tag) | pypi (its newest PyPI release, harness from the matching tag)"
        required: false
        default: "checkout"
        type: string

jobs:
  compliance:
    name: Compliance suite (${{ matrix.db.name }}, seerdb ${{ inputs.seerdb }}, dialect ${{ inputs.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two tiers rather than every one, to stay inside the Actions budget:
        # the oldest server this dialect reaches at all, and a current one.
        db:
          - name: "11g"
            image: "gvenzl/oracle-xe:11-slim"
            service: "XE"
          - name: "23ai Free"
            image: "gvenzl/oracle-free:23-slim"
            service: "FREEPDB1"
    services:
      oracle:
        image: ${{ matrix.db.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: pyo
          APP_USER_PASSWORD: pyo123
        ports:
          - 1521:1521
        # The image ships healthcheck.sh; wait for first-boot setup before the
        # test step. The shared-memory bump keeps the newer instance from
        # OOM-stalling partway through the suite.
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 90s
          --shm-size=2g
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `dialect: tag` tests this repository's newest release rather than the
      # checkout, so the two releases can be paired: seerdb's tag and ours.
      - name: Use this repository's newest tag
        if: inputs.dialect == 'tag'
        run: |
          TAG=$(git tag --list | grep -E '^v?[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          echo "newest sqlalchemy-seerdb tag: $TAG"
          git checkout -q "$TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # `dialect: pypi` tests this repository's newest PyPI release, the
      # artifact a user installs. The wheel ships only the package, so the
      # compliance harness (test/, conftest.py, the mandatory test.cfg) comes
      # from the checkout at the tag matching the installed version, which is
      # never installed from.
      - name: Use this repository's newest PyPI release
        if: inputs.dialect == 'pypi'
        run: |
          pip install "sqlalchemy-seerdb[test]"
          VERSION=$(pip show sqlalchemy-seerdb | awk '/^Version:/{print $2}')
          echo "newest sqlalchemy-seerdb release on PyPI: $VERSION"
          git checkout -q "$VERSION"
          # pytest runs from the repository root, where the checked-out package
          # directory would shadow the installed wheel; only the harness stays.
          rm -rf sqlalchemy_seerdb
      # `pip install .[test]` brings the released driver from PyPI, whatever the
      # dependency floor resolves to: that is what `latest` (or `pypi`) tests.
      - if: inputs.dialect != 'pypi'
        run: pip install .[test]
      # A version pins the released driver to exactly that release.
      - name: Pin the released driver
        if: inputs.seerdb != 'latest' && inputs.seerdb != 'pypi' && inputs.seerdb != 'master' && inputs.seerdb != 'tag'
        run: pip install "seerdb==${{ inputs.seerdb }}"
      # `tag` installs the driver at its newest git tag: the same code as the
      # newest release, resolved from the repository rather than from PyPI's
      # index, which lags a publish by minutes.
      - name: Use the driver's newest tag
        if: inputs.seerdb == 'tag'
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/seerdb/seerdb \
                | sed 's#.*/##' | grep -E '^v?[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          echo "newest seerdb tag: $TAG"
          pip install --force-reinstall --no-deps "seerdb @ git+https://github.com/seerdb/seerdb@$TAG"
      # `master` swaps in the driver's current master.
      #
      # --force-reinstall, not --upgrade: master carries the same version string
      # as the last release until a release bumps it, so pip compares the two,
      # sees no change and silently keeps the published wheel. That is not
      # hypothetical — it happened, and the giveaway was a run whose numbers were
      # identical to the previous one.
      - name: Use the driver's current master
        if: inputs.seerdb == 'master'
        run: |
          pip install --force-reinstall --no-deps \
            "seerdb @ git+https://github.com/seerdb/seerdb@master"
      - name: Which driver and dialect this leg runs
        run: |
          python -c "import seerdb, inspect, pathlib; \
            print('driver', seerdb.__version__ if hasattr(seerdb, '__version__') else '?', \
                  'from:', pathlib.Path(inspect.getfile(seerdb)).parent)"
          pip show seerdb | grep -E '^(Version|Location)'
          python -c "import sqlalchemy_seerdb, inspect, pathlib; \
            print('dialect', sqlalchemy_seerdb.__version__, \
                  'from:', pathlib.Path(inspect.getfile(sqlalchemy_seerdb)).parent)"
      # SQLAlchemy's suite requires a second namespace called test_schema, which
      # on this backend is a username, plus grants and a tablespace the test
      # user needs; test/prepare_test_schema.py does it and says why. The broad
      # ANY-object grants it makes are safe *here*: this container is created
      # for one run and thrown away.
      - name: Create the test_schema namespace
        run: >-
          python test/prepare_test_schema.py --host localhost
          --service "${{ matrix.db.service }}" --dba-password oracle --test-user pyo
      # Gating against a released driver (`latest`, `tag`, a version): the
      # dialect must work with the driver its dependency floor resolves to.
      # Informational against `master`: a failure there is either a driver
      # regression, to be raised on the driver's side, or a dialect change that
      # has to wait for the next driver release; neither may block this repo.
      - name: Run the compliance suite against ${{ matrix.db.name }}
        continue-on-error: ${{ inputs.seerdb == 'master' }}
        run: >-
          python -m pytest -q --tb=short -s
          --dburi "oracle+seerdb://pyo:pyo123@localhost:1521/?service_name=${{ matrix.db.service }}"
