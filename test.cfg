# Test configuration only — this is NOT packaging config, which lives entirely
# in pyproject.toml.
#
# SQLAlchemy's compliance-suite plugin reads these two keys with configparser,
# from a file named setup.cfg or test.cfg in the working directory. It does not
# look at pyproject.toml, and both keys are read unconditionally, so the file
# cannot be dropped: passing --requirements on the command line does not
# substitute for it. test.cfg is the name of the two that cannot be mistaken for
# packaging metadata. Run pytest from the repository root so it is found.
[sqla_testing]
requirement_cls = sqlalchemy_seerdb.requirements:Requirements
profile_file = test/profiles.txt
